# crowdsec requires at least one profile in this file to start. This is the
# canonical default; it does not fire for the loadgen payload (Remediation is
# left at its zero value, so the filter never matches), so no decisions are
# written. The allowlist check we measure runs in the alert-ingestion path,
# before profile evaluation, and is unaffected.
name: default_ip_remediation
filters:
  - Alert.Remediation == true && Alert.GetScope() == "Ip"
decisions:
  - type: ban
    duration: 4h
on_success: break
